<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diffs edit-mode fixture</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
      }
      [data-diff-mount] {
        max-width: 900px;
      }
      [data-editor-log] {
        margin-top: 16px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <a
      data-fixtures-index
      href="/test/e2e/fixtures/index.html"
      style="
        display: inline-block;
        margin-bottom: 16px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: #0b62d6;
        text-decoration: none;
      "
      >&larr; All fixtures</a
    >
    <!--
      NOTE: clicking into the additions column to place the caret exercises a
      real cross-browser gap. The editor reads its selection through the shadow
      root, and the pinned CI Chromium (and older browsers/WebViews) lack
      Selection.getComposedRanges. That path now falls back to the older
      ShadowRoot.getSelection() (see getShadowRootRange in src/editor/editor.ts),
      so a plain click seeds the caret and typing works without a workaround.
      edit.pw.ts intentionally clicks-then-types to guard this behavior.
    -->
    <div data-diff-mount></div>
    <div data-editor-log></div>

    <script type="module">
      import { FileDiff } from '/dist/index.js';
      import { Editor } from '/dist/edit/index.js';

      const mount = document.querySelector('[data-diff-mount]');
      const log = document.querySelector('[data-editor-log]');
      if (!(mount instanceof HTMLElement) || !(log instanceof HTMLElement)) {
        throw new Error('Missing edit fixture nodes.');
      }

      const withAnnotations = new URLSearchParams(location.search).has(
        'annotations'
      );
      const oldFile = withAnnotations
        ? {
            name: 'edit.ts',
            contents: `const shared = 1;
export default shared;
`,
          }
        : {
            name: 'edit.ts',
            contents: `const value = 1;
const removed = 'old';
export default value;
`,
          };

      const newFile = withAnnotations
        ? {
            name: 'edit.ts',
            contents: `const shared = 1;
const annotated = 2;
export default shared;
`,
          }
        : {
            name: 'edit.ts',
            contents: `const value = 1;
const added = 'new';
export default value;
`,
          };
      const lineAnnotations = withAnnotations
        ? [{ lineNumber: 2, side: 'additions' }]
        : undefined;

      // Every onChange payload is recorded so tests can assert the editor emits
      // the updated file contents rather than inspecting the DOM alone.
      const events = [];
      window.__editorEvents = events;

      const editor = new Editor({
        onChange(file) {
          events.push(file.contents);
          log.textContent = `changes: ${events.length}`;
        },
      });
      window.__editor = editor;

      const instance = new FileDiff({
        disableFileHeader: true,
        theme: { dark: 'pierre-dark', light: 'pierre-light' },
        themeType: 'dark',
        diffStyle: 'split',
        enableGutterUtility: new URLSearchParams(location.search).has(
          'gutterUtility'
        ),
        onGutterUtilityClick() {},
        renderAnnotation() {
          const annotation = document.createElement('div');
          annotation.dataset.testAnnotation = '';
          annotation.style.height = '80px';
          annotation.textContent = 'annotation';
          return annotation;
        },
      });

      instance.render({
        oldFile,
        newFile,
        lineAnnotations,
        containerWrapper: mount,
      });
      editor.edit(instance);
      // Counts completed editor re-syncs. A full render keeps the editable
      // element in place, so specs can't detect completion by watching for a
      // replacement element — they await this counter instead. By the time it
      // increments, the render has landed and the editor's focus/selection
      // restore has been invoked.
      window.__syncCount = 0;
      const originalSyncRenderView = editor.__syncRenderView;
      editor.__syncRenderView = (...args) => {
        const result = originalSyncRenderView.apply(editor, args);
        window.__syncCount += 1;
        return result;
      };
      window.__forceEditorFullRender = () => {
        instance.setOptions({
          ...instance.options,
          disableLineNumbers: !(instance.options.disableLineNumbers ?? false),
        });
        instance.render({ oldFile, newFile, forceRender: true });
      };
      window.__moveEditorContainer = () => {
        const previousContainer = mount.querySelector('diffs-container');
        const nextContainer = document.createElement('diffs-container');
        instance.setOptions({
          ...instance.options,
          onPostRender(container, _, phase) {
            if (phase === 'unmount' && container === previousContainer) {
              container.remove();
            }
          },
        });
        mount.appendChild(nextContainer);
        instance.render({
          oldFile,
          newFile,
          fileContainer: nextContainer,
          forceRender: true,
        });
      };

      const findAdditionsContent = () => {
        const host = mount.querySelector('diffs-container');
        const shadow = host?.shadowRoot;
        if (shadow == null) {
          return undefined;
        }
        for (const code of shadow.querySelectorAll('[data-code]')) {
          if (code.dataset.deletions !== undefined) {
            continue;
          }
          for (const child of code.children) {
            if (child.dataset.content !== undefined) {
              return child;
            }
          }
        }
        return undefined;
      };

      const waitForEditable = async () => {
        const started = performance.now();
        while (true) {
          const content = findAdditionsContent();
          if (
            content != null &&
            content.getAttribute('contenteditable') === 'true'
          ) {
            return;
          }
          if (performance.now() - started > 5000) {
            throw new Error('Timed out waiting for editable additions column.');
          }
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
      };

      await waitForEditable();
      window.__editReady = true;
    </script>
  </body>
</html>
