<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diffs editable-file fixture</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
      }
      [data-diff-mount] {
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <a
      data-fixtures-index
      href="/test/e2e/fixtures/index.html"
      style="
        display: inline-block;
        margin-bottom: 16px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: #0b62d6;
        text-decoration: none;
      "
      >&larr; All fixtures</a
    >
    <div data-diff-mount></div>

    <script type="module">
      import { File } from '/dist/index.js';
      import { Editor } from '/dist/edit/index.js';

      const mount = document.querySelector('[data-diff-mount]');
      if (!(mount instanceof HTMLElement)) {
        throw new Error('Missing editable fixture mount.');
      }

      const params = new URLSearchParams(location.search);
      const windowed = params.has('windowed');
      if (params.has('nested'))
        mount.style.cssText = 'height: 560px; overflow: auto';
      const file = {
        name: 'editable.ts',
        contents: params.has('horizontal')
          ? Array.from({ length: 300 }, (_, index) =>
              index === 7
                ? `target ${'x'.repeat(300)} target`
                : index === 8 || index === 200
                  ? `${'y'.repeat(280)} target`
                  : `padding ${index + 1}`
            ).join('\n')
          : params.has('candidates')
            ? Array.from({ length: 3000 }, (_, index) =>
                [9, 999, 1799].includes(index)
                  ? `target ${index + 1}`
                  : `padding ${index + 1}`
              ).join('\n')
            : params.has('large')
              ? Array.from(
                  { length: 10000 },
                  (_, index) => `target line ${index + 1}`
                ).join('\n')
              : params.has('viewport')
                ? Array.from({ length: 200 }, (_, index) =>
                    [19, 99, 100, 160].includes(index)
                      ? `target ${index + 1}`
                      : `padding ${index + 1}`
                  ).join('\n')
                : windowed
                  ? Array.from(
                      { length: 300 },
                      (_, index) => `const foo${index} = foo;`
                    ).join('\n')
                  : `const foo = 1;
const bar = foo + foo;
const baz = foo;
`,
      };

      // Record every onChange so tests can assert the emitted file contents,
      // which is more robust than scraping tokenized DOM text.
      const events = [];
      window.__editorEvents = events;

      const editor = new Editor('file');
      window.__editor = editor;

      // Editable single-file surface: `useTokenTransformer` mirrors what the
      // React <File edit> path enables before attaching an editor.
      const instance = new File({
        onEditChange({ file }) {
          events.push(file.contents);
        },
        disableFileHeader: true,
        theme: { dark: 'pierre-dark', light: 'pierre-light' },
        themeType: 'dark',
        useTokenTransformer: true,
      });
      const renderRange = (startingLine) => ({
        startingLine,
        totalLines: 20,
        bufferBefore: 0,
        bufferAfter: 0,
      });
      instance.render({
        file,
        containerWrapper: mount,
        renderRange: windowed ? renderRange(0) : undefined,
      });
      window.__renderEditorWindow = (startingLine) =>
        instance.render({
          file,
          forceRender: true,
          renderRange: windowed ? renderRange(startingLine) : undefined,
        });
      editor.edit(instance);

      const waitForEditable = async () => {
        const started = performance.now();
        while (true) {
          const host = mount.querySelector('diffs-container');
          const content = host?.shadowRoot?.querySelector('[data-content]');
          if (content?.getAttribute('contenteditable') === 'true') {
            return;
          }
          if (performance.now() - started > 5000) {
            throw new Error('Timed out waiting for editable content.');
          }
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
      };

      await waitForEditable();
      window.__editableReady = true;
    </script>
  </body>
</html>
