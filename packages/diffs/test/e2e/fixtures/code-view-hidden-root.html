<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diffs CodeView hidden-root fixture</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
      }
      [data-code-view-root] {
        width: min(720px, calc(100vw - 32px));
        height: 400px;
        overflow: auto;
        border: 1px solid #ccc;
      }
      [data-wrapper][hidden] {
        display: none;
      }
      /* `?hide=content-visibility` hides the wrapper without dropping its
         layout, the way a tab panel that keeps its state does. */
      [data-wrapper][data-hide='content-visibility'][hidden] {
        display: block;
        content-visibility: hidden;
      }
    </style>
  </head>
  <body>
    <a
      data-fixtures-index
      href="/test/e2e/fixtures/index.html"
      style="
        display: inline-block;
        margin-bottom: 16px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: #0b62d6;
        text-decoration: none;
      "
      >&larr; All fixtures</a
    >
    <div data-wrapper>
      <div data-code-view-root></div>
    </div>

    <script type="module">
      import { CodeView } from '/dist/index.js';

      const root = document.querySelector('[data-code-view-root]');
      const wrapper = document.querySelector('[data-wrapper]');
      const hide = new URLSearchParams(location.search).get('hide');
      if (hide != null) {
        wrapper.dataset.hide = hide;
      }

      // Long lines so every row soft-wraps to several visual lines.
      function makeContents(lineCount, tag = '') {
        const lines = [];
        for (let index = 1; index <= lineCount; index++) {
          lines.push(
            `Line ${index}${tag}: ${'lorem ipsum dolor sit amet consectetur '.repeat(4)}`
          );
        }
        return `${lines.join('\n')}\n`;
      }

      const codeView = new CodeView({
        theme: { dark: 'pierre-dark', light: 'pierre-light' },
        themeType: 'dark',
        overflow: 'wrap',
        disableFileHeader: true,
      });
      codeView.setup(root);
      let version = 0;
      function setContents(lineCount, tag) {
        codeView.setItems([
          {
            id: 'file',
            type: 'file',
            file: {
              name: 'wrapped.md',
              contents: makeContents(lineCount, tag),
            },
            version: version++,
          },
        ]);
      }
      setContents(200);

      window.__hiddenRoot = {
        hide() {
          wrapper.hidden = true;
        },
        show() {
          wrapper.hidden = false;
        },
        // Swaps the file for a shorter one whose lines carry `tag`.
        replaceContents(tag) {
          setContents(50, tag);
        },
        // Hides the root in a frame callback queued before the CodeView's own
        // render, replaces the file, and shows the root in a callback queued
        // after it: the root is hidden only while that render runs.
        replaceContentsWhileHiddenForOneFrame(tag) {
          requestAnimationFrame(() => {
            wrapper.hidden = true;
          });
          setContents(50, tag);
          requestAnimationFrame(() => {
            wrapper.hidden = false;
          });
        },
        scrollToLine(lineNumber) {
          codeView.scrollTo({
            type: 'line',
            id: 'file',
            lineNumber,
            align: 'start',
            behavior: 'instant',
          });
        },
        firstRowText() {
          return (
            codeView
              .getRenderedItems()[0]
              ?.element?.shadowRoot?.querySelector('[data-content] [data-line]')
              ?.textContent ?? ''
          );
        },
        // How many wrapped-row heights the file cached as zero.
        zeroHeights() {
          const heights =
            codeView.getRenderedItems()[0]?.instance.cache.heights;
          let zeros = 0;
          for (const height of heights?.values() ?? []) {
            if (height === 0) zeros++;
          }
          return zeros;
        },
        // How many rows the file holds a measured height for. Every line here
        // wraps, so a measured row always has an entry.
        measuredRows() {
          return (
            codeView.getRenderedItems()[0]?.instance.cache.heights.size ?? 0
          );
        },
        // Rendered rows as [line number, top relative to the root, height].
        rows() {
          const content = codeView
            .getRenderedItems()[0]
            ?.element?.shadowRoot?.querySelector('[data-content]');
          if (content == null) {
            return [];
          }
          const rootTop = root.getBoundingClientRect().top;
          return [...content.querySelectorAll('[data-line]')].map((row) => {
            const rect = row.getBoundingClientRect();
            return [
              Number(row.dataset.line),
              Math.round(rect.top - rootTop),
              Math.round(rect.height),
            ];
          });
        },
        scrollTop: () => root.scrollTop,
      };
      window.__hiddenRootReady = true;
    </script>
  </body>
</html>
