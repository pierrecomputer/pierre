<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diffs highlights highlighter fixture</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
      }
      [data-diff-mount] {
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <a
      data-fixtures-index
      href="/test/e2e/fixtures/index.html"
      style="
        display: inline-block;
        margin-bottom: 16px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: #0b62d6;
        text-decoration: none;
      "
      >&larr; All fixtures</a
    >
    <div data-diff-mount></div>

    <script type="module">
      import {
        FileDiff,
        parseDiffFromFile,
        setHighlighter,
      } from '/dist/index.js';
      import { WorkerPoolManager } from '/dist/worker/index.js';
      import { highlightsHighlighter } from '/dist/highlights.js';

      const mount = document.querySelector('[data-diff-mount]');
      if (!(mount instanceof HTMLElement)) {
        throw new Error('Missing diff mount.');
      }

      // A real worker pool: with the default shiki registration it accepts
      // work, and registering highlights must route rendering back to the main
      // thread (workers always highlight with shiki).
      const pool = new WorkerPoolManager(
        {
          workerFactory: () =>
            new Worker('/dist/worker/worker.js', { type: 'module' }),
          poolSize: 1,
        },
        { langs: ['typescript'] }
      );
      window.__poolWorkingWithShiki = pool.isWorkingPool();

      setHighlighter(highlightsHighlighter);
      window.__poolWorkingWithHighlights = pool.isWorkingPool();

      const oldFile = {
        name: 'greetings.ts',
        contents: `export function greet(name) {
  return 'hi ' + name;
}
`,
      };
      const newFile = {
        name: 'greetings.ts',
        contents: `export function greet(name) {
  return \`hi \${name}!\`;
}
`,
      };

      const instance = new FileDiff({
        disableFileHeader: true,
        theme: { dark: 'pierre-dark', light: 'pierre-light' },
        themeType: 'dark',
        diffStyle: 'split',
      });
      instance.render({
        fileDiff: parseDiffFromFile(oldFile, newFile),
        containerWrapper: mount,
      });

      // Wait until the shadow DOM has committed real diff rows before
      // signalling readiness so tests never race the first paint.
      const waitForRows = async () => {
        const started = performance.now();
        while (true) {
          const host = mount.querySelector('diffs-container');
          const row = host?.shadowRoot?.querySelector('[data-line-type]');
          if (row != null) {
            return;
          }
          if (performance.now() - started > 5000) {
            throw new Error('Timed out waiting for diff rows.');
          }
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
      };

      await waitForRows();
      window.__highlightsReady = true;
    </script>
  </body>
</html>
