<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diffs highlights highlighter fixture</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
      }
      [data-diff-mount] {
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <a
      data-fixtures-index
      href="/test/e2e/fixtures/index.html"
      style="
        display: inline-block;
        margin-bottom: 16px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: #0b62d6;
        text-decoration: none;
      "
      >&larr; All fixtures</a
    >
    <div data-diff-mount></div>

    <script type="module">
      import {
        FileDiff,
        parseDiffFromFile,
        setHighlighter,
      } from '/dist/index.js';
      import { WorkerPoolManager } from '/dist/worker/index.js';
      import { highlightsHighlighter } from '/dist/highlights.js';

      const mount = document.querySelector('[data-diff-mount]');
      if (!(mount instanceof HTMLElement)) {
        throw new Error('Missing diff mount.');
      }

      // Record real highlight requests, including a Shiki request proving the
      // worker is ready before Highlights takes over rendering.
      window.__highlightWorkerRequests = [];
      const pool = new WorkerPoolManager(
        {
          workerFactory: () => {
            const worker = new Worker('/dist/worker/worker.js', {
              type: 'module',
            });
            const postMessage = worker.postMessage.bind(worker);
            worker.postMessage = (message, ...args) => {
              if (message.type === 'file' || message.type === 'diff') {
                window.__highlightWorkerRequests.push(message.type);
              }
              postMessage(message, ...args);
            };
            return worker;
          },
          poolSize: 1,
        },
        { langs: ['typescript'] }
      );
      await pool.initialize();
      await pool.primeFileHighlightCache({
        name: 'probe.ts',
        contents: 'const probe = 1;',
        cacheKey: 'worker-probe',
      });
      window.__poolWorkingWithShiki = pool.isWorkingPool();

      setHighlighter(highlightsHighlighter);
      window.__poolWorkingWithHighlights = pool.isWorkingPool();

      const oldFile = {
        name: 'greetings.ts',
        contents: `export function greet(name) {
  return 'hi ' + name;
}
`,
      };
      const newFile = {
        name: 'greetings.ts',
        contents: `export function greet(name) {
  return \`hi \${name}!\`;
}
`,
      };

      const instance = new FileDiff(
        {
          disableFileHeader: true,
          theme: { dark: 'pierre-dark', light: 'pierre-light' },
          themeType: 'dark',
          diffStyle: 'split',
        },
        pool
      );
      instance.render({
        fileDiff: parseDiffFromFile(oldFile, newFile),
        containerWrapper: mount,
      });

      // Wait for Highlights colors, since the first paint can be plain text.
      const waitForHighlight = async () => {
        const started = performance.now();
        while (true) {
          const host = mount.querySelector('diffs-container');
          const spans = host?.shadowRoot?.querySelectorAll(
            '[data-content] span'
          );
          if (
            Array.from(spans ?? []).some(
              (span) =>
                span.style.getPropertyValue('--diffs-token-dark') === '#ff678d'
            )
          ) {
            return;
          }
          if (performance.now() - started > 5000) {
            throw new Error('Timed out waiting for Highlights colors.');
          }
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
      };

      await waitForHighlight();
      window.__highlightsReady = true;
      window.addEventListener(
        'pagehide',
        () => {
          instance.cleanUp();
          pool.terminate();
        },
        { once: true }
      );
    </script>
  </body>
</html>
