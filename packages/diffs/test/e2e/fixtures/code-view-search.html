<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeView editable search</title>
    <style>
      [data-code-view-root] {
        height: 560px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <button data-outside>Outside CodeView</button>
    <div data-code-view-root tabindex="0"></div>
    <script type="module">
      import {
        CodeView,
        parseDiffFromFile,
        registerCustomTheme,
      } from '/dist/index.js';
      import { Editor } from '/dist/edit/index.js';

      const params = new URLSearchParams(location.search);
      const searchTheme = params.get('search-theme');
      if (searchTheme != null) {
        for (const type of ['light', 'dark']) {
          const name = `search-${type}`;
          registerCustomTheme(name, () =>
            Promise.resolve({
              name,
              type,
              fg: type === 'light' ? '#202020' : '#eeeeee',
              bg: type === 'light' ? '#ffffff' : '#101010',
              colors: {
                'editor.selectionBackground': '#009fff66',
                ...(searchTheme !== 'missing'
                  ? {
                      'terminal.ansiYellow':
                        type === 'light' ? '#b68d05' : '#f2d04b',
                    }
                  : {}),
                ...(searchTheme === 'explicit'
                  ? {
                      'editor.findMatchBackground': '#65432166',
                      'editor.findMatchHighlightBackground': '#12345644',
                    }
                  : {}),
              },
              tokenColors: [],
            })
          );
        }
      }
      const diffStyle =
        params.get('diffStyle') === 'unified' ? 'unified' : 'split';
      const view = new CodeView({
        diffStyle,
        ...(params.has('retokenize')
          ? { preferredHighlighter: 'highlights', themeType: 'dark' }
          : {}),
        ...(searchTheme != null
          ? {
              theme: { light: 'search-light', dark: 'search-dark' },
              themeType: 'dark',
              preferredHighlighter: 'shiki-js',
            }
          : {}),
        expandUnchanged:
          params.has('viewport') ||
          params.has('candidates') ||
          params.has('dense') ||
          params.has('horizontal')
            ? true
            : undefined,
        createEditor: (type, options, key) => new Editor(type, options, key),
      });
      window.__codeView = view;
      view.setup(document.querySelector('[data-code-view-root]'));
      const scopedFixture = params.has('scope');
      if (params.has('horizontal')) {
        const file = {
          name: 'horizontal.txt',
          contents: Array.from({ length: 300 }, (_, index) =>
            index === 7
              ? `target ${'x'.repeat(300)} target`
              : index === 8 || index === 200
                ? `${'y'.repeat(280)} target`
                : `padding ${index + 1}`
          ).join('\n'),
        };
        view.setItems([
          params.get('kind') === 'file'
            ? { id: 'item', type: 'file', edit: params.has('edit'), file }
            : {
                id: 'item',
                type: 'diff',
                edit: params.has('edit'),
                fileDiff: parseDiffFromFile(
                  {
                    ...file,
                    contents: file.contents.replace(
                      'x'.repeat(300),
                      'a'.repeat(300)
                    ),
                  },
                  file
                ),
              },
        ]);
      } else if (params.has('dense')) {
        const file = {
          name: 'dense.txt',
          contents: Array.from(
            { length: 10000 },
            (_, index) => `target ${index + 1}`
          ).join('\n'),
        };
        view.setItems([
          params.get('kind') === 'file'
            ? { id: 'item', type: 'file', edit: params.has('edit'), file }
            : {
                id: 'item',
                type: 'diff',
                edit: params.has('edit'),
                fileDiff: parseDiffFromFile(
                  {
                    ...file,
                    contents: file.contents.replace('target 1\n', 'old\n'),
                  },
                  file
                ),
              },
        ]);
      } else if (params.has('viewport') || params.has('candidates')) {
        const file = {
          name: 'viewport.txt',
          contents: Array.from(
            { length: params.has('candidates') ? 3000 : 200 },
            (_, index) =>
              (params.has('candidates')
                ? [9, 999, 1799]
                : [19, 99, 100, 160]
              ).includes(index)
                ? `target ${index + 1}`
                : `padding ${index + 1}`
          ).join('\n'),
        };
        view.setItems([
          params.get('kind') === 'file'
            ? { id: 'item', type: 'file', edit: params.has('edit'), file }
            : {
                id: 'item',
                type: 'diff',
                edit: params.has('edit'),
                fileDiff: parseDiffFromFile(
                  {
                    ...file,
                    contents: 'old\n',
                  },
                  file
                ),
              },
        ]);
      } else if (params.has('highlight') || params.has('retokenize')) {
        const file = {
          name: 'highlight.ts',
          contents: 'const value = "target target";\n// target updated\n',
        };
        view.setItems([
          params.get('kind') === 'file'
            ? { id: 'item', type: 'file', edit: params.has('edit'), file }
            : {
                id: 'item',
                type: 'diff',
                edit: params.has('edit'),
                fileDiff: parseDiffFromFile(
                  {
                    ...file,
                    contents: 'const value = "target target";\n// target\n',
                  },
                  file
                ),
              },
          {
            id: 'padding',
            type: 'file',
            file: { name: 'padding.txt', contents: 'padding\n'.repeat(1000) },
          },
        ]);
      } else if (params.has('recycle')) {
        const file = {
          name: 'replace.txt',
          contents: 'target one\nkeep\ntarget two\n',
        };
        view.setItems([
          params.get('kind') === 'file'
            ? { id: 'item', type: 'file', edit: true, file }
            : {
                id: 'item',
                type: 'diff',
                edit: true,
                fileDiff: parseDiffFromFile(
                  { ...file, contents: 'old one\nkeep\nold two\n' },
                  file
                ),
              },
          {
            id: 'padding',
            type: 'file',
            file: { name: 'padding.txt', contents: 'padding\n'.repeat(1000) },
          },
        ]);
      } else if (params.has('collapsed')) {
        const many = params.has('many');
        const lines = Array.from({ length: many ? 10000 : 220 }, (_, index) =>
          many
            ? `target ${index + 1}`
            : index === 100
              ? 'hidden target'
              : `line ${index + 1}`
        );
        const next = [...lines];
        next[9] = many ? 'target changed' : 'changed';
        next[many ? 9959 : 179] = many
          ? 'target changed again'
          : 'changed again';
        view.setItems([
          {
            id: 'diff',
            type: 'diff',
            edit: true,
            fileDiff: parseDiffFromFile(
              { name: 'context.txt', contents: lines.join('\n') },
              { name: 'context.txt', contents: next.join('\n') }
            ),
          },
        ]);
      } else {
        view.setItems(
          scopedFixture
            ? [
                {
                  id: 'diff',
                  type: 'diff',
                  edit: true,
                  fileDiff: parseDiffFromFile(
                    {
                      name: 'diff.txt',
                      contents: 'target deleted\nunchanged\n',
                    },
                    { name: 'diff.txt', contents: 'target added\nunchanged\n' }
                  ),
                },
                {
                  id: 'second',
                  type: 'file',
                  edit: true,
                  file: { name: 'second.txt', contents: 'target target\n' },
                },
                {
                  id: 'readonly',
                  type: 'file',
                  file: { name: 'readonly.txt', contents: 'target readonly\n' },
                },
              ]
            : [
                {
                  id: 'file',
                  type: 'file',
                  edit: true,
                  version: 1,
                  file: {
                    name: 'example.txt',
                    contents: Array.from({ length: 800 }, (_, index) =>
                      [125, 126, 128, 201].includes(index + 1)
                        ? `github match at ${index + 1}`
                        : `line ${index + 1}`
                    ).join('\n'),
                  },
                },
              ]
        );
      }
      if (params.has('multiple')) {
        const root = document.createElement('div');
        root.dataset.secondaryView = '';
        root.tabIndex = 0;
        root.style.cssText = 'height: 160px; overflow: auto';
        document.body.appendChild(root);
        const second = new CodeView();
        second.setup(root);
        second.setItems([
          {
            id: 'second',
            type: 'file',
            file: { name: 'second.txt', contents: 'target target\n' },
          },
        ]);
      }
    </script>
  </body>
</html>
