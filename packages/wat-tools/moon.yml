$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'library'
tags: ['tsdown', 'publishable']

tasks:
  build:
    script: 'tsdown --clean && cp -R wat dist/wat'
    inputs:
      - '*.ts'
      - 'wat/**/*.wat'
      - 'tsconfig.json'
    outputs:
      - 'dist'
    options:
      merge: 'replace'

  test:
    deps:
      - 'build'

  typecheck:
    deps:
      - 'build'

  prepublish:
    deps:
      - 'test'
      - 'typecheck'
