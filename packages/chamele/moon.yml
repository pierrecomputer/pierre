$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'library'
tags: ['tsdown', 'publishable']

tasks:
  # Replaces the tsdown tag build: scripts/build.ts compiles the WAT sources
  # in src/ into dist/ (wasm binary, base64 module, expanded wat) and
  # regenerates the $Token ABI in lib/token-types.ts, then tsdown compiles the
  # TypeScript glue in lib/ into the same dist/ (its config keeps
  # `clean: false` so the wasm artifacts survive). The wasm artifacts are
  # gitignored, so workspace consumers (diffs) reach them through their
  # `^:build` deps.
  build:
    script: 'rm -rf dist && bun ./scripts/build.ts && tsdown'
    deps:
      - '^:build'
    inputs:
      # lib/token-types.ts is derived from the $Token enum in the WAT sources
      # and rewritten by this task, so it must not key the cache.
      - 'src/**/*'
      - 'lib/**/*'
      - '!lib/token-types.ts'
      - 'themes/index.ts'
      - 'themes/*.json'
      - 'scripts/build.ts'
      - 'tsdown.config.ts'
      - 'tsconfig.json'
    outputs:
      - 'dist'
    options:
      merge: 'replace'

  # The suite compiles the wasm from the WAT sources itself and imports the
  # glue straight from lib/, so it replaces the inherited deps and needs no
  # build.
  test:
    command: 'bun test'
    options:
      merge: 'replace'

  prepublish:
    deps:
      - 'test'

  # Local-only benchmarks; explicit options instead of a preset so they stay
  # runnable in CI-marked agent shells (see .moon/tasks/tag-tsdown.yml). They
  # need `build` for the shipped-size table (dist glue sizes).
  bench:
    command: 'bun ./benchmark/bench.ts'
    deps:
      - 'build'
    options:
      cache: false
      runInCI: 'always'

  bench-tokens:
    command: 'bun ./benchmark/bench.ts --tokens'
    deps:
      - 'build'
    options:
      cache: false
      runInCI: 'always'

  bench-stream:
    command: 'bun ./benchmark/bench.ts --stream'
    deps:
      - 'build'
    options:
      cache: false
      runInCI: 'always'
