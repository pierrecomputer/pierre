# Baselines for the SIMD in highlights/src/simd.rs. x86-64-v2 (2009 and
# later: SSSE3, SSE4.2, POPCNT) enables the SSE backend; without it x86-64
# falls back to plain arrays. wasm needs simd128 for the wasm backend.
# A RUSTFLAGS environment variable replaces these, so builds that set it
# (scripts/pgo.sh) target the host only.
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

[target.wasm32-wasip1]
rustflags = ["-C", "target-feature=+simd128"]
# Cargo runs a crate's tests from its own directory, one below this one.
runner = ["node", "--no-warnings", "../scripts/wasi-run.mjs"]
