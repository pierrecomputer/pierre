[package]
name = "highlights"
version = "0.0.0"
description = "Native Rust build of the Highlights syntax highlighter"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Bounds-check every memory access and trap instead of reading out of range.
checked = []
# Hand-written JS/TS lexer core (`src/native`), compared with the translated
# lexer for parity and speed.
native-core = []
# The native core's token loop in AArch64 assembly (`src/native/lexasm.s`),
# alongside the Rust loop, for comparison.
native-asm = ["native-core"]

[dependencies]
unicode-ident = "1"
