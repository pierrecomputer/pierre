[toolchain]
channel = "1.99.1"
# Platforms the build must compile for: x86-64 macOS runs under Rosetta for
# testing the non-ARM code paths; Linux, Windows, and wasm are checked.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "wasm32-unknown-unknown",
  "wasm32-wasip1",
]
