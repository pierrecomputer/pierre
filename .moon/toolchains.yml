$schema: 'https://moonrepo.dev/schemas/toolchains.json'

# pnpm manages workspace installs and package-manager operations. Tool versions
# come from .prototools (versionFromPrototools defaults to true), so pins live in
# one place. Bun stays available for direct runtime and test script execution.
javascript:
  packageManager: 'pnpm'

# Do not set `version` here. The node version comes from .prototools.
# `syncVersionManagerConfig` needs an explicit `version`, so moon cannot write
# .node-version. The root:check-tool-pins task compares the two files instead.
node: {}

pnpm:
  installArgs:
    - '--frozen-lockfile'

bun: {}
